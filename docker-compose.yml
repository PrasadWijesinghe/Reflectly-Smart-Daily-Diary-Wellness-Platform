services:
  postgres:
    image: postgres:16-alpine
    container_name: reflectly_postgres
    environment:
      POSTGRES_DB: reflectly
      POSTGRES_USER: reflectly
      POSTGRES_PASSWORD: reflectly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflectly -d reflectly"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reflectly_backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://reflectly:reflectly@postgres:5432/reflectly
      DIRECT_URL: postgresql://reflectly:reflectly@postgres:5432/reflectly
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_GRAFANA_URL: http://localhost:3000
        VITE_GRAFANA_DASHBOARD_URL: http://localhost:3000
    container_name: reflectly_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: reflectly_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: reflectly_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
